name: ci

on:
  push:
    branches: [main, 'codex/msw1907-*']
  pull_request:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: ./lib
          key: ${{ runner.os }}-node-18-build-${{ github.sha }}

  test_unit:
    name: test (unit)
    needs: build
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: ./lib
          key: ${{ runner.os }}-node-18-build-${{ github.sha }}

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  test-node:
    name: test (node.js)
    needs: build
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: ./lib
          key: ${{ runner.os }}-node-18-build-${{ github.sha }}

      - name: Install dependencies
        run: pnpm install

      - name: Node.js tests
        run: pnpm test:node

  test-browser:
    name: test (browser)
    needs: build
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: ./lib
          key: ${{ runner.os }}-node-18-build-${{ github.sha }}

      - name: Install dependencies
        run: pnpm install

      - name: Playwright install
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:browser

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/browser/test-results

  test-native:
    name: test (react-native)
    needs: build
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: ./lib
          key: ${{ runner.os }}-node-18-build-${{ github.sha }}

      - name: Install dependencies
        run: pnpm install

      - name: Native tests
        run: pnpm test:native
